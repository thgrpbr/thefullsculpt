name: Build e publicar (branch deploy)

# A cada push na main: gera o site estático e publica o resultado na branch `deploy`,
# que a Hostinger lê (Git → public_html).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Publicar out/ na branch deploy
        run: |
          cd out
          touch .nojekyll
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy

  api-tests:
    # Não bloqueia o deploy; sinaliza regressões na API PHP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sodium, pdo_sqlite, mbstring
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint PHP
        run: for f in public/api/index.php public/api/install.php public/api/lib/*.php public/api/lib/routes/*.php scripts/dev-api.php; do php -l "$f"; done
      - name: Testes de integração
        run: |
          export TFS_CONFIG="$RUNNER_TEMP/tfs-config.php"
          php scripts/dev-api.php init "$TFS_CONFIG" "$RUNNER_TEMP/test.sqlite"
          php -S 127.0.0.1:8081 scripts/dev-api.php > "$RUNNER_TEMP/php.log" 2>&1 &
          sleep 2
          BASE=http://127.0.0.1:8081 DB="$RUNNER_TEMP/test.sqlite" node scripts/api-test.mjs
          php scripts/dev-api.php init "$TFS_CONFIG" "$RUNNER_TEMP/test.sqlite"
          BASE=http://127.0.0.1:8081 DB="$RUNNER_TEMP/test.sqlite" node scripts/api-admin-test.mjs
          php scripts/dev-api.php init "$TFS_CONFIG" "$RUNNER_TEMP/test.sqlite"
          node scripts/fake-smtp.mjs > "$RUNNER_TEMP/smtp.log" 2>&1 &
          sleep 1
          BASE=http://127.0.0.1:8081 DB="$RUNNER_TEMP/test.sqlite" node scripts/api-account-test.mjs
          php scripts/dev-api.php init "$TFS_CONFIG" "$RUNNER_TEMP/test.sqlite"
          BASE=http://127.0.0.1:8081 DB="$RUNNER_TEMP/test.sqlite" node scripts/api-legal-test.mjs
          php scripts/dev-api.php init "$TFS_CONFIG" "$RUNNER_TEMP/test.sqlite"
          BASE=http://127.0.0.1:8081 DB="$RUNNER_TEMP/test.sqlite" node scripts/api-perms-test.mjs
          php scripts/dev-api.php init "$TFS_CONFIG" "$RUNNER_TEMP/test.sqlite"
          BASE=http://127.0.0.1:8081 node scripts/api-pricing-test.mjs
